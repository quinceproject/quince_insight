# Trasy panelu Quince Insight (ARCHITEKTURA §9).
#
# Komplet tras istnieje od fali 0, razem ze stubem kazdej akcji: trasa wskazujaca
# kontroler albo metode, ktorych nie ma, wywraca router calego panelu PrestaShop,
# nie tylko jedna strone.
#
# `_legacy_controller` wskazuje ukryta zakladke ekranu — na niej wisza uprawnienia
# sprawdzane przez `#[AdminSecurity]`. Widoki: GET. Zapisy i akcje: POST + CSRF.
#
# Trase spoza ARCHITEKTURA §9 agent dopisuje NA KONCU swojego bloku
# (miedzy `# >>> <litera>` a `# <<< <litera>`) i wymienia w raporcie.

